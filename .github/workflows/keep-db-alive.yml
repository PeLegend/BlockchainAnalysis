name: Keep Neo4j AuraDB awake

on:
  schedule:
    # Run daily before the 72-hour AuraDB Free inactivity threshold.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo4j-keepalive
  cancel-in-progress: true

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: 860cc17b
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Neo4j driver
        run: npm install --no-save --no-package-lock neo4j-driver@6

      - name: Ping Neo4j
        run: |
          node <<'NODE'
          const neo4j = require('neo4j-driver');

          const { NEO4J_URI, NEO4J_USER = 'neo4j', NEO4J_PASSWORD, NEO4J_DATABASE = '860cc17b' } = process.env;
          if (!NEO4J_URI || !NEO4J_PASSWORD) {
            throw new Error('Missing NEO4J_URI or NEO4J_PASSWORD GitHub secret');
          }

          const driver = neo4j.driver(
            NEO4J_URI,
            neo4j.auth.basic(NEO4J_USER, NEO4J_PASSWORD),
            { connectionAcquisitionTimeout: 30000 }
          );
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const maxAttempts = 6;

          (async () => {
            let lastError;
            try {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                const session = driver.session({ database: NEO4J_DATABASE });
                try {
                  const result = await session.run('RETURN 1 AS alive');
                  const alive = result.records[0].get('alive').toNumber();
                  if (alive !== 1) throw new Error('Unexpected keep-alive response');
                  console.log('Neo4j keep-alive succeeded on attempt ' + attempt);
                  return;
                } catch (error) {
                  lastError = error;
                  if (attempt === maxAttempts) throw error;
                  console.warn('Neo4j attempt ' + attempt + ' failed: ' + error.message);
                  await wait(attempt * 10000);
                } finally {
                  await session.close();
                }
              }
              throw lastError;
            } catch (error) {
              console.error('Neo4j keep-alive failed: ' + error.message);
              process.exitCode = 1;
            } finally {
              await driver.close();
            }
          })();
          NODE
