name: Keep Neo4j AuraDB awake

on:
  schedule:
    # Run daily before the 72-hour AuraDB Free inactivity threshold.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo4j-keepalive
  cancel-in-progress: true

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEO4J_HOST: 1fd5add3.databases.neo4j.io
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: 1fd5add3
    steps:
      - name: Ping Neo4j over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          host="${NEO4J_HOST}"
          neo4j_ip=''
          for resolver_url in \
            "https://cloudflare-dns.com/dns-query?name=${host}&type=A" \
            "https://dns.google/resolve?name=${host}&type=A"; do
            dns_response="$(curl --ipv4 --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 \
              --header 'accept: application/dns-json' \
              "${resolver_url}")" || continue
            resolver_name="${resolver_url%%\?*}"
            dns_status="$(jq -r '.Status // "invalid"' <<<"${dns_response}" 2>/dev/null || echo invalid)"
            dns_records="$(jq -r '[.Answer[]? | select(.type == 1)] | length' <<<"${dns_response}" 2>/dev/null || echo 0)"
            echo "DNS resolver ${resolver_name}: status=${dns_status}, ipv4_records=${dns_records}"
            neo4j_ip="$(jq -r '.Answer[]? | select(.type == 1) | .data' <<<"${dns_response}" | head -n1)"
            [[ -n "${neo4j_ip}" ]] && break
          done
          if [[ -z "${neo4j_ip}" ]]; then
            echo 'Could not resolve the Neo4j host through the available DNS resolvers.' >&2
            exit 1
          fi
          endpoint="https://${host}/db/${NEO4J_DATABASE}/query/v2"
          response="$(curl --ipv4 --resolve "${host}:443:${neo4j_ip}" --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            --user "${NEO4J_USER}:${NEO4J_PASSWORD}" \
            --header 'Content-Type: application/json' \
            --data '{"statement":"RETURN 1 AS alive"}' \
            "${endpoint}")"
          if [[ "${response}" == *'"errors"'* ]]; then
            echo 'Neo4j query returned errors.' >&2
            exit 1
          fi
          echo 'Neo4j keep-alive succeeded.'
